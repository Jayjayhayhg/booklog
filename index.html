<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책장 — 독서 포트폴리오</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Html5-QRCode (ZXing 대체) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --bg: #0F0E0C;
  --surface: #1A1815;
  --surface2: #242220;
  --border: #2E2B28;
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-pale: rgba(201,168,76,0.08);
  --text: #F0EBE0;
  --text-muted: #7A7468;
  --text-sub: #B0A898;
  --green: #4CAF82;
  --blue: #5B8FD4;
  --orange: #E07B3A;
  --purple: #9B72CF;
  --red: #CF6679;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(91,143,212,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,14,12,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -1px;
  flex-shrink: 0;
}
.logo em { color: var(--gold); font-style: normal; }

/* ── 아이 프로필 선택기 (헤더 내) ── */
.profile-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  justify-content: center;
  overflow-x: auto;
  scrollbar-width: none;
}
.profile-selector::-webkit-scrollbar { display: none; }
.profile-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}
.profile-chip.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #0F0E0C;
  font-weight: 700;
}
.profile-chip .chip-avatar {
  font-size: 14px;
  line-height: 1;
}
.profile-add-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px dashed var(--border);
  background: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.profile-add-btn:hover { border-color: var(--gold); color: var(--gold); }

.total-badge {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  flex-shrink: 0;
}
.total-badge strong { color: var(--gold); }

/* ── 검색바 (책장 상단) ── */
.search-bar-wrap {
  padding: 12px 16px 0;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.search-bar {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 14px;
  gap: 8px;
  transition: border-color 0.2s;
}
.search-bar:focus-within { border-color: var(--gold); }
.search-bar-icon { color: var(--text-muted); font-size: 14px; }
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 10px 0;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
}
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar-clear {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  display: none;
}
.search-bar-clear.show { display: block; }

/* ── Stats ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 1;
}
.stat-card {
  background: var(--surface);
  padding: 14px 8px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s;
}
.stat-card:hover, .stat-card.active { background: var(--gold-pale); }
.stat-emoji { font-size: 16px; margin-bottom: 3px; }
.stat-num {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.stat-label { font-size: 10px; color: var(--text-muted); }
.stat-card:nth-child(1) .stat-num { color: var(--blue); }
.stat-card:nth-child(2) .stat-num { color: var(--green); }
.stat-card:nth-child(3) .stat-num { color: var(--orange); }
.stat-card:nth-child(4) .stat-num { color: var(--purple); }

/* ── Main Tabs ── */
.main-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 1;
}
.main-tab {
  flex: 1;
  padding: 14px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.main-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── Pages ── */
.page { display: none; position: relative; z-index: 1; }
.page.show { display: block; }

/* ── 책장 페이지 ── */
#page-books {
  padding: 16px 16px 120px;
  max-width: 600px;
  margin: 0 auto;
}

.filter-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface);
  color: var(--text-muted);
  white-space: nowrap;
  transition: all 0.2s;
}
.filter-tab.active { background: var(--gold); color: #0F0E0C; border-color: var(--gold); font-weight: 700; }

.section-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

.book-list { display: flex; flex-direction: column; gap: 10px; }

.book-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  gap: 12px;
  transition: all 0.2s;
  animation: fadeIn 0.3s ease both;
  position: relative;
  overflow: hidden;
}
.book-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.book-card[data-cat="영어책"]::before  { background: var(--blue); }
.book-card[data-cat="한글책"]::before  { background: var(--green); }
.book-card[data-cat="집중듣기"]::before { background: var(--orange); }
.book-card[data-cat="수학"]::before    { background: var(--purple); }
.book-card:hover { border-color: var(--gold); background: var(--surface2); transform: translateX(2px); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.book-cover {
  width: 50px; height: 68px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; overflow: hidden;
}
.book-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }

.book-info { flex: 1; min-width: 0; }
.book-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px; font-weight: 600;
  line-height: 1.4; margin-bottom: 2px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.book-author { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

.book-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
}
.stars { display: flex; gap: 1px; }
.star { font-size: 12px; color: var(--border); }
.star.on { color: var(--gold); }

.cat-tag {
  font-size: 10px; padding: 2px 8px;
  border-radius: 20px; font-weight: 600;
}
.cat-영어책  { background: rgba(91,143,212,0.15);  color: var(--blue); }
.cat-한글책  { background: rgba(76,175,130,0.15);  color: var(--green); }
.cat-집중듣기 { background: rgba(224,123,58,0.15); color: var(--orange); }
.cat-수학    { background: rgba(155,114,207,0.15); color: var(--purple); }

.book-pages-date {
  display: flex;
  gap: 8px;
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-muted);
}
.pages-badge {
  color: var(--gold);
  font-weight: 600;
}

.book-memo {
  margin-top: 6px;
  font-size: 11px; color: var(--text-sub);
  line-height: 1.6;
  border-left: 2px solid var(--gold);
  padding-left: 8px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* 카드 액션 버튼들 */
.card-actions {
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
}
.edit-btn, .delete-btn {
  background: none; border: none;
  color: var(--text-muted);
  font-size: 14px; cursor: pointer;
  padding: 4px; line-height: 1;
  transition: color 0.2s;
  border-radius: 4px;
}
.edit-btn:hover { color: var(--gold); }
.delete-btn:hover { color: var(--red); }

/* ── 월별 결산 페이지 ── */
#page-monthly {
  padding: 16px 16px 120px;
  max-width: 600px;
  margin: 0 auto;
}

/* ── 읽기 목표 카드 ── */
.goal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.goal-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.goal-card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.goal-edit-btn {
  background: none; border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.goal-edit-btn:hover { border-color: var(--gold); color: var(--gold); }
.goal-progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}
.goal-progress-bar-bg {
  flex: 1;
  height: 10px;
  background: var(--surface2);
  border-radius: 5px;
  overflow: hidden;
}
.goal-progress-bar {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  transition: width 0.6s ease;
}
.goal-progress-bar.done { background: linear-gradient(90deg, var(--green), #7DE0B0); }
.goal-text {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.goal-text .done-mark { color: var(--green); }
.goal-no-target {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  padding: 8px 0;
}
.goal-no-target button {
  background: none;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--gold);
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  padding: 6px 14px;
  cursor: pointer;
  margin-top: 6px;
  transition: all 0.2s;
}
.goal-no-target button:hover { border-color: var(--gold); background: var(--gold-pale); }

/* ── 목표 설정 모달 안 인라인 폼 ── */
.goal-inline-form {
  display: none;
  margin-top: 10px;
  gap: 8px;
}
.goal-inline-form.show { display: flex; }
.goal-inline-form input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.goal-inline-form input:focus { border-color: var(--gold); }
.goal-inline-form button {
  background: var(--gold);
  color: #0F0E0C;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}
.goal-inline-form button:hover { background: var(--gold-light); }

.monthly-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.month-nav {
  display: flex;
  align-items: center;
  gap: 16px;
}
.month-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.month-nav-btn:hover { border-color: var(--gold); color: var(--gold); }
.current-month {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  min-width: 100px;
  text-align: center;
}

/* ── 결산 요약 카드 ── */
.monthly-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
}
.summary-card .s-num {
  font-family: 'Noto Serif KR', serif;
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  color: var(--gold);
  margin-bottom: 4px;
}
.summary-card .s-unit {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 400;
}
.summary-card .s-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── 카테고리별 breakdown ── */
.cat-breakdown {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}
.cat-breakdown-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.cat-row:last-child { margin-bottom: 0; }
.cat-row-label {
  font-size: 12px;
  width: 70px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.cat-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}
.cat-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}
.bar-영어책  { background: var(--blue); }
.bar-한글책  { background: var(--green); }
.bar-집중듣기 { background: var(--orange); }
.bar-수학    { background: var(--purple); }
.cat-row-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  min-width: 40px;
  text-align: right;
}

/* ── 월별 책 목록 ── */
.monthly-books { display: flex; flex-direction: column; gap: 8px; }
.monthly-book-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: fadeIn 0.3s ease both;
}
.mbi-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-영어책  { background: var(--blue); }
.dot-한글책  { background: var(--green); }
.dot-집중듣기 { background: var(--orange); }
.dot-수학    { background: var(--purple); }
.mbi-title {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.mbi-pages { font-size: 11px; color: var(--gold); font-weight: 600; }
.mbi-date  { font-size: 11px; color: var(--text-muted); }

/* ── 연간 요약 ── */
.yearly-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  margin-bottom: 20px;
}
.yearly-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.yearly-cell:hover { border-color: var(--gold); }
.yearly-cell.has-books { background: var(--gold-pale); border-color: rgba(201,168,76,0.3); }
.yearly-cell.current-sel { border-color: var(--gold); background: rgba(201,168,76,0.15); }
.yc-month { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
.yc-cnt { font-size: 14px; font-weight: 700; color: var(--text); }
.yc-cnt.has { color: var(--gold); }

/* ── Empty ── */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
}
.empty-emoji { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 13px; line-height: 1.8; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #0F0E0C;
  border: none;
  border-radius: 50px;
  padding: 15px 28px;
  font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 32px rgba(201,168,76,0.3);
  transition: all 0.2s;
  z-index: 90;
  white-space: nowrap;
}
.fab:hover {
  background: var(--gold-light);
  transform: translateX(-50%) translateY(-3px);
}

/* ── Modal 공통 ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 44px;
  width: 100%;
  max-width: 500px;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.32,0.72,0,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px; font-weight: 700;
  text-align: center;
  margin-bottom: 20px;
  color: var(--gold);
}

/* ── Camera (Html5-QRCode) ── */
.camera-wrap {
  position: relative;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  display: none;
}
.camera-wrap.show { display: block; }
/* html5-qrcode가 내부에 video 생성 */
#qr-reader {
  width: 100% !important;
  border: none !important;
}
#qr-reader video { width: 100% !important; border-radius: 10px; }
#qr-reader img { display: none !important; }
/* 스캔 오버레이 */
.scan-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.scan-line {
  position: absolute;
  left: 10%; right: 10%;
  height: 2px;
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
  animation: scanAnim 2s ease-in-out infinite;
}
@keyframes scanAnim {
  0%, 100% { top: 20%; }
  50% { top: 75%; }
}
.cam-corner {
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--gold);
  border-style: solid;
  border-width: 0;
}
.cam-corner.tl { top:12px; left:12px; border-top-width:3px; border-left-width:3px; }
.cam-corner.tr { top:12px; right:12px; border-top-width:3px; border-right-width:3px; }
.cam-corner.bl { bottom:12px; left:12px; border-bottom-width:3px; border-left-width:3px; }
.cam-corner.br { bottom:12px; right:12px; border-bottom-width:3px; border-right-width:3px; }

.btn-camera {
  width: 100%;
  background: var(--surface2);
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 13px;
  color: var(--text-sub);
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}
.btn-camera:hover, .btn-camera.scanning { border-color: var(--gold); color: var(--gold); background: var(--gold-pale); }

/* ── Inputs ── */
.input-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.isbn-row { display: flex; gap: 8px; margin-bottom: 8px; }
.input-field {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.input-field:focus { border-color: var(--gold); }
.input-field::placeholder { color: var(--text-muted); }
.btn-search {
  background: var(--gold);
  color: #0F0E0C;
  border: none; border-radius: 10px;
  padding: 11px 16px;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.btn-search:hover { background: var(--gold-light); }

.status-msg { font-size: 12px; color: var(--gold); text-align: center; min-height: 18px; margin-bottom: 8px; }

/* ── Book Preview ── */
.book-preview {
  display: none;
  background: var(--gold-pale);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  gap: 12px;
  align-items: center;
}
.book-preview.show { display: flex; }
.preview-img {
  width: 44px; height: 60px;
  border-radius: 5px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0; overflow: hidden;
}
.preview-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
.preview-info { flex: 1; }
.preview-title { font-family: 'Noto Serif KR', serif; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.preview-author { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.preview-pages { font-size: 12px; color: var(--gold); font-weight: 600; }

/* ── Category ── */
.cat-btns { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.cat-btn {
  flex: 1; min-width: calc(50% - 3px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface2);
  color: var(--text-muted);
  transition: all 0.2s;
  text-align: center;
}
.cat-btn.active-영어책  { border-color: var(--blue);   background: rgba(91,143,212,0.1);  color: var(--blue);   }
.cat-btn.active-한글책  { border-color: var(--green);  background: rgba(76,175,130,0.1);  color: var(--green);  }
.cat-btn.active-집중듣기 { border-color: var(--orange); background: rgba(224,123,58,0.1); color: var(--orange); }
.cat-btn.active-수학    { border-color: var(--purple); background: rgba(155,114,207,0.1); color: var(--purple); }

/* ── Stars ── */
.modal-stars { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; }
.modal-star { font-size: 28px; cursor: pointer; color: var(--border); transition: all 0.15s; }
.modal-star.on { color: var(--gold); }
.modal-star:hover { transform: scale(1.2); }
.rating-hint { text-align: center; font-size: 12px; color: var(--text-muted); min-height: 18px; margin-bottom: 14px; }

textarea.input-field { width: 100%; height: 76px; resize: none; line-height: 1.6; margin-bottom: 18px; }

.btn-save {
  width: 100%;
  background: var(--gold); color: #0F0E0C;
  border: none; border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-save:hover { background: var(--gold-light); }
.btn-save:disabled { background: var(--surface2); color: var(--text-muted); cursor: not-allowed; }

.loading-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

/* ── 프로필 관리 모달 ── */
#profileModal .modal { max-height: 70vh; }
.profile-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.profile-item {
  display: flex;
  align-items: center;
  gap: 12px;

}
.profile-item-avatar { font-size: 24px; }
.profile-item-name {

}
.profile-item-count {

}
.profile-delete-btn {

}
.profile-delete-btn:hover { color: var(--red); }
.add-profile-form {

}
.add-profile-form input {
  flex: 1;

  border: 1px solid var(--border);

}
.add-profile-form input:focus { border-color: var(--gold); }
.add-profile-form button {

  font-size: 13px;

.avatar-pick {

}
.avatar-opt {

/* ── 수정 모달 ── */
#editModal .modal-title { color: var(--gold-light); }
</style>

      <span class="avatar-opt" data-avatar="🐱">🐱</span>
      <span class="avatar-opt" data-avatar="🐶">🐶</span>
      <span class="avatar-opt" data-avatar="🌟">🌟</span>
      <span class="avatar-opt" data-avatar="🦊">🦊</span>
      <span class="avatar-opt" data-avatar="🐸">🐸</span>
      <span class="avatar-opt" data-avatar="🐧">🐧</span>
    </div>
    <div class="add-profile-form">
      <input type="text" id="newProfileName" placeholder="이름 입력 (예: 지우, 민준)">
      <button onclick="addProfile()">추가</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let books = [];
let currentFilter = '전체';
let currentPage = 'books';
let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();
let bookSearchQuery = '';

// 추가 기능 상태
let currentBook = null;
let currentCat = '';
let currentStar = 0;
let cameraActive = false;
let html5QRCode = null;

// 수정 기능 상태
let editingBookId = null;
let editCat = '';
let editStar = 0;

// 프로필 상태 (localStorage)
let profiles = [];
let currentProfileId = 'all';

// 목표 (localStorage)
let goals = {}; // key: "profileId-YYYY-MM" -> 목표 권수

const starLabels = ['','별로예요','그저 그래요','괜찮아요','좋아요','최고예요! ⭐'];
const cats = ['영어책','한글책','집중듣기','수학'];
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5Sj9r5qKlr2d8z_I_z13IB5FJNaSzDF-PXBpL8gpJOKScNC2sur1odeHyg_kGiMKj/exec";

function catEmoji(c) {
  return {'영어책':'📚','한글책':'📖','집중듣기':'🎧','수학':'🔢'}[c] || '📗';
}

// ══════════════════════════════════════════
// PROFILES (localStorage)
// ══════════════════════════════════════════
function loadProfiles() {
  try {
    const saved = localStorage.getItem('booklog_profiles');
    profiles = saved ? JSON.parse(saved) : [];
    const savedCurrent = localStorage.getItem('booklog_current_profile');
    currentProfileId = savedCurrent || 'all';
  } catch(e) {
    profiles = [];
    currentProfileId = 'all';
  }
}

function saveProfiles() {
  localStorage.setItem('booklog_profiles', JSON.stringify(profiles));
  localStorage.setItem('booklog_current_profile', currentProfileId);
}

function renderProfileSelector() {
  const sel = document.getElementById('profileSelector');
  let html = `<div class="profile-chip ${currentProfileId==='all'?'active':''}" onclick="switchProfile('all')">
    <span class="chip-avatar">📚</span> 전체
  </div>`;
  profiles.forEach(p => {
    html += `<div class="profile-chip ${currentProfileId===p.id?'active':''}" onclick="switchProfile('${p.id}')">
      <span class="chip-avatar">${p.avatar}</span> ${p.name}
    </div>`;
  });
  html += `<button class="profile-add-btn" onclick="openProfileModal()" title="프로필 추가">+</button>`;
  sel.innerHTML = html;
}

function switchProfile(id) {
  currentProfileId = id;
  saveProfiles();
  renderProfileSelector();
  renderAll();
}

function openProfileModal() {
  renderProfileListModal();
  document.getElementById('profileModal').classList.add('open');
}
function closeProfileModal() {
  document.getElementById('profileModal').classList.remove('open');
}
function handleProfileOverlay(e) {
  if (e.target === document.getElementById('profileModal')) closeProfileModal();
}

function renderProfileListModal() {
  const list = document.getElementById('profileList');
  if (profiles.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px 0;">아직 프로필이 없어요</div>`;
    return;
  }
  list.innerHTML = profiles.map(p => {
    const cnt = books.filter(b => b.profileId === p.id).length;
    return `<div class="profile-item">
      <div class="profile-item-avatar">${p.avatar}</div>
      <div class="profile-item-name">${p.name}</div>
      <div class="profile-item-count">${cnt}권</div>
      <button class="profile-delete-btn" onclick="deleteProfile('${p.id}')">×</button>
    </div>`;
  }).join('');
}

let selectedAvatar = '👧';
document.querySelectorAll('.avatar-opt').forEach(opt => {
  opt.addEventListener('click', function() {
    document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
    this.classList.add('selected');
    selectedAvatar = this.dataset.avatar;
  });
});

function addProfile() {
  const name = document.getElementById('newProfileName').value.trim();
  if (!name) return;
  const id = 'p_' + Date.now();
  profiles.push({ id, name, avatar: selectedAvatar });
  saveProfiles();
  document.getElementById('newProfileName').value = '';
  renderProfileSelector();
  renderProfileListModal();
}

function deleteProfile(id) {
  if (!confirm('이 프로필을 삭제할까요?\n(기록된 책은 삭제되지 않아요)')) return;
  profiles = profiles.filter(p => p.id !== id);
  if (currentProfileId === id) currentProfileId = 'all';
  saveProfiles();
  renderProfileSelector();
  renderProfileListModal();
  renderAll();
}

// ══════════════════════════════════════════
// GOALS (localStorage)
// ══════════════════════════════════════════
function goalKey() {
  const ym = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
  return `${currentProfileId}-${ym}`;
}

function loadGoals() {
  try {
    const saved = localStorage.getItem('booklog_goals');
    goals = saved ? JSON.parse(saved) : {};
  } catch(e) { goals = {}; }
}

function saveGoals() {
  localStorage.setItem('booklog_goals', JSON.stringify(goals));
}

function renderGoalCard(monthBooks) {
  const key = goalKey();
  const target = goals[key] || 0;
  const actual = monthBooks.length;
  const display = document.getElementById('goalDisplay');

  if (!target) {
    display.innerHTML = `<div class="goal-no-target">
      <div>이달의 읽기 목표를 설정해보세요!</div>
      <button onclick="toggleGoalForm()">+ 목표 설정</button>
    </div>`;
  } else {
    const pct = Math.min(Math.round((actual / target) * 100), 100);
    const done = actual >= target;
    display.innerHTML = `
      <div class="goal-progress-wrap">
        <div class="goal-progress-bar-bg">
          <div class="goal-progress-bar ${done?'done':''}" style="width:${pct}%"></div>
        </div>
        <div class="goal-text">
          ${done ? `<span class="done-mark">✅</span> ` : ''}${actual} / ${target}권
        </div>
      </div>
      ${done ? `<div style="font-size:12px;color:var(--green);text-align:center;margin-top:8px;font-weight:600;">🎉 목표 달성!</div>` : ''}`;
  }

  // 현재 goalInput에 값 세팅
  document.getElementById('goalInput').value = target || '';
}

function toggleGoalForm() {
  const form = document.getElementById('goalForm');
  form.classList.toggle('show');
  if (form.classList.contains('show')) document.getElementById('goalInput').focus();
}

function saveGoal() {
  const val = parseInt(document.getElementById('goalInput').value);
  if (!val || val < 1) {
    delete goals[goalKey()];
  } else {
    goals[goalKey()] = val;
  }
  saveGoals();
  document.getElementById('goalForm').classList.remove('show');
  renderMonthly();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function initApp() {
  loadProfiles();
  loadGoals();
  renderProfileSelector();
  loadBooks();
  renderMonthLabel();
  renderYearlyGrid();
}
if (window._firebaseReady) initApp();
else window.addEventListener('firebaseReady', initApp);

// ══════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════
async function loadBooks() {
  document.getElementById('loadingBooks').style.display = 'block';
  try {
    const q = window._query(window._col(window._db,'books'), window._orderBy('createdAt','desc'));
    const snap = await window._getDocs(q);
    books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  } catch(e) {
    console.error(e);
    document.getElementById('loadingBooks').style.display = 'none';
  }
}

async function saveToFirestore(book) {
  const ref = await window._addDoc(window._col(window._db,'books'), book);
  return ref.id;
}

async function deleteFromFirestore(id) {
  await window._deleteDoc(window._doc(window._db,'books',id));
}

async function updateInFirestore(id, data) {
  await window._updateDoc(window._doc(window._db,'books',id), data);
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function renderAll() {
  document.getElementById('loadingBooks').style.display = 'none';
  updateStats();
  renderBookList();
  renderMonthly();
  renderYearlyGrid();
}

// ── 통계 ──
function updateStats() {
  const filtered = getProfileBooks();
  let total = 0;
  cats.forEach(c => {
    const cnt = filtered.filter(b => b.cat === c).length;
    document.getElementById('cnt-' + c).textContent = cnt;
    total += cnt;
  });
  document.getElementById('totalCount').textContent = total;
}

// 현재 프로필에 해당하는 책 목록
function getProfileBooks() {
  if (currentProfileId === 'all') return books;
  return books.filter(b => b.profileId === currentProfileId);
}

// ── 책 목록 ──
function renderBookList() {
  const list = document.getElementById('bookList');
  let filtered = getProfileBooks();
  if (currentFilter !== '전체') filtered = filtered.filter(b => b.cat === currentFilter);

  // 내 책장 검색 필터
  if (bookSearchQuery) {
    const q = bookSearchQuery.toLowerCase();
    filtered = filtered.filter(b => b.title.toLowerCase().includes(q));
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-emoji">${bookSearchQuery ? '🔍' : (currentFilter==='전체'?'📚':catEmoji(currentFilter))}</div><p>${bookSearchQuery ? `"${bookSearchQuery}"와(과) 일치하는 책이 없어요.` : (currentFilter==='전체'?'아직 기록된 책이 없어요.<br>아래 버튼으로 첫 책을 추가해보세요!':`${currentFilter} 기록이 없어요.`)}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map((b, i) => `
    <div class="book-card" data-cat="${b.cat}" style="animation-delay:${i*0.04}s">
      <div class="book-cover">${b.coverImg ? `<img src="${b.coverImg}" onerror="this.parentElement.textContent='📗'">` : catEmoji(b.cat)}</div>
      <div class="book-info">
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}${b.publisher?' · '+b.publisher:''}</div>
        <div class="book-meta-row">
          <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star ${n<=b.star?'on':''}">★</span>`).join('')}</div>
          <span class="cat-tag cat-${b.cat}">${catEmoji(b.cat)} ${b.cat}</span>
        </div>
        <div class="book-pages-date">
          ${b.pages ? `<span class="pages-badge">${b.pages.toLocaleString()}p</span>` : ''}
          <span>${b.dateLabel || ''}</span>
          ${b.profileId ? `<span>${getProfileName(b.profileId)}</span>` : ''}
        </div>
        ${b.memo ? `<div class="book-memo">${b.memo}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="edit-btn" onclick="openEditModal('${b.id}',event)" title="수정">✏️</button>
        <button class="delete-btn" onclick="deleteBook('${b.id}',event)" title="삭제">×</button>
      </div>
    </div>
  `).join('');
}

function getProfileName(id) {
  if (id === 'all' || !id) return '';
  const p = profiles.find(p => p.id === id);
  return p ? `${p.avatar} ${p.name}` : '';
}

// ── 월별 결산 ──
function renderMonthLabel() {
  const label = `${viewYear}년 ${viewMonth+1}월`;
  document.getElementById('currentMonthLabel').textContent = label;
  document.getElementById('monthlyListTitle').textContent = `${viewMonth+1}월의 책`;
}

function renderMonthly() {
  renderMonthLabel();

  const profileBooks = getProfileBooks();
  const monthBooks = profileBooks.filter(b => {
    if (!b.createdAt) return false;
    const d = new Date(b.createdAt);
    return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
  });

  // 목표 렌더
  renderGoalCard(monthBooks);

  // 권수 / 쪽수
  document.getElementById('m-books').textContent = monthBooks.length;
  const totalPages = monthBooks.reduce((s, b) => s + (b.pages || 0), 0);
  document.getElementById('m-pages').innerHTML = `${totalPages.toLocaleString()}<span class="s-unit" style="font-size:16px">p</span>`;

  // 카테고리 breakdown
  const maxCnt = Math.max(...cats.map(c => monthBooks.filter(b=>b.cat===c).length), 1);
  const breakdown = document.getElementById('catBreakdown');
  breakdown.innerHTML = `<div class="cat-breakdown-title">카테고리별</div>` +
    cats.map(c => {
      const cnt = monthBooks.filter(b => b.cat === c).length;
      const pages = monthBooks.filter(b => b.cat === c).reduce((s,b) => s+(b.pages||0), 0);
      const pct = Math.round((cnt / maxCnt) * 100);
      return `
        <div class="cat-row">
          <div class="cat-row-label">${catEmoji(c)} ${c}</div>
          <div class="cat-bar-wrap"><div class="cat-bar bar-${c}" style="width:${pct}%"></div></div>
          <div class="cat-row-count">${cnt}권${pages ? ' · '+pages+'p' : ''}</div>
        </div>`;
    }).join('');

  // 이달 책 목록
  const mList = document.getElementById('monthlyBookList');
  if (monthBooks.length === 0) {
    mList.innerHTML = `<div class="empty"><div class="empty-emoji">📭</div><p>이달에 기록된 책이 없어요.</p></div>`;
    return;
  }
  mList.innerHTML = monthBooks.map((b,i) => `
    <div class="monthly-book-item" style="animation-delay:${i*0.04}s">
      <div class="mbi-dot dot-${b.cat}"></div>
      <div class="mbi-title">${b.title}</div>
      ${b.pages ? `<div class="mbi-pages">${b.pages}p</div>` : ''}
      <div class="mbi-date">${b.dateLabel||''}</div>
    </div>
  `).join('');
}

// ── 연간 그리드 ──
function renderYearlyGrid() {
  const grid = document.getElementById('yearlyGrid');
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const profileBooks = getProfileBooks();
  grid.innerHTML = months.map((m, i) => {
    const cnt = profileBooks.filter(b => {
      if (!b.createdAt) return false;
      const d = new Date(b.createdAt);
      return d.getFullYear() === viewYear && d.getMonth() === i;
    }).length;
    const isSelected = (i === viewMonth);
    return `
      <div class="yearly-cell ${cnt>0?'has-books':''} ${isSelected?'current-sel':''}" onclick="jumpToMonth(${i})">
        <div class="yc-month">${m}</div>
        <div class="yc-cnt ${cnt>0?'has':''}">${cnt||'·'}</div>
      </div>`;
  }).join('');
}

function jumpToMonth(m) {
  viewMonth = m;
  renderMonthly();
  renderYearlyGrid();
}

function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderMonthly();
  renderYearlyGrid();
}

// ══════════════════════════════════════════
// 내 책장 검색
// ══════════════════════════════════════════
function onBookSearch(val) {
  bookSearchQuery = val.trim();
  document.getElementById('searchClearBtn').classList.toggle('show', bookSearchQuery.length > 0);
  renderBookList();
}

function clearBookSearch() {
  document.getElementById('bookSearchInput').value = '';
  bookSearchQuery = '';
  document.getElementById('searchClearBtn').classList.remove('show');
  renderBookList();
}

// ══════════════════════════════════════════
// 책 수정 기능
// ══════════════════════════════════════════
function openEditModal(id, e) {
  e.stopPropagation();
  const book = books.find(b => b.id === id);
  if (!book) return;
  editingBookId = id;
  editCat = book.cat || '';
  editStar = book.star || 0;

  // 미리보기
  const img = document.getElementById('editPreviewImg');
  if (book.coverImg) {
    img.innerHTML = `<img src="${book.coverImg}" onerror="this.parentElement.textContent='📗'">`;
  } else {
    img.textContent = catEmoji(book.cat);
  }
  document.getElementById('editPreviewTitle').textContent = book.title;
  document.getElementById('editPreviewAuthor').textContent = `${book.author}${book.publisher?' · '+book.publisher:''}`;
  document.getElementById('editMemoInput').value = book.memo || '';

  // 카테고리
  document.querySelectorAll('#editCatBtns .cat-btn').forEach(b => b.className = 'cat-btn');
  if (editCat) document.getElementById('edit-cat-'+editCat).classList.add('active-'+editCat);

  // 별점
  document.querySelectorAll('#editStars .modal-star').forEach((s,i) => s.classList.toggle('on', i < editStar));
  document.getElementById('editRatingHint').textContent = editStar ? '⭐'.repeat(editStar) + ' ' + starLabels[editStar] : '별점 선택 (선택사항)';

  document.getElementById('editSaveBtn').disabled = false;
  document.getElementById('editSaveBtn').textContent = '수정 완료';
  document.getElementById('editOverlay').classList.add('open');
}

function handleEditOverlay(e) {
  if (e.target === document.getElementById('editOverlay')) closeEditModal();
}
function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('open');
  editingBookId = null;
}

function setEditCat(cat) {
  editCat = cat;
  document.querySelectorAll('#editCatBtns .cat-btn').forEach(b => b.className = 'cat-btn');
  document.getElementById('edit-cat-'+cat).classList.add('active-'+cat);
}

function setEditStar(n) {
  editStar = n;
  document.querySelectorAll('#editStars .modal-star').forEach((s,i) => s.classList.toggle('on', i < n));
  document.getElementById('editRatingHint').textContent = '⭐'.repeat(n) + ' ' + starLabels[n];
}

async function saveEdit() {
  if (!editingBookId) return;
  if (!editCat) { alert('카테고리를 선택해주세요!'); return; }
  document.getElementById('editSaveBtn').disabled = true;
  document.getElementById('editSaveBtn').textContent = '저장 중...';

  const updates = {
    cat: editCat,
    star: editStar,
    memo: document.getElementById('editMemoInput').value.trim()
  };

  try {
    await updateInFirestore(editingBookId, updates);
    const idx = books.findIndex(b => b.id === editingBookId);
    if (idx !== -1) Object.assign(books[idx], updates);
    renderAll();
    closeEditModal();
  } catch(e) {
    alert('수정 실패: ' + e.message);
    document.getElementById('editSaveBtn').disabled = false;
    document.getElementById('editSaveBtn').textContent = '수정 완료';
  }
}

// ══════════════════════════════════════════
// PAGE SWITCH / FILTER
// ══════════════════════════════════════════
function switchPage(page, el) {
  currentPage = page;
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
  document.getElementById('page-' + page).classList.add('show');
  if (page === 'monthly') renderMonthly();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('listTitle').textContent = cat === '전체' ? '전체 기록' : `${catEmoji(cat)} ${cat}`;
  if (currentPage !== 'books') document.querySelectorAll('.main-tab')[0].click();
  renderBookList();
}

// ══════════════════════════════════════════
// CAMERA — Html5-QRCode
// ══════════════════════════════════════════
async function toggleCamera() {
  if (cameraActive) { await stopCamera(); return; }
  document.getElementById('cameraBtn').textContent = '⏹ 스캔 중지';
  document.getElementById('cameraBtn').classList.add('scanning');
  document.getElementById('cameraWrap').classList.add('show');
  cameraActive = true;

  try {
    html5QRCode = new Html5Qrcode("qr-reader");
    await html5QRCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 140 } },
      (decodedText) => {
        // 바코드 인식 성공
        document.getElementById('isbnInput').value = decodedText;
        stopCamera();
        switchSearchTab('isbn');
        searchByISBN();
      },
      () => {} // 인식 실패는 무시
    );
  } catch(e) {
    setStatus('카메라 접근 실패. ISBN을 직접 입력해주세요.');
    await stopCamera();
  }
}

async function stopCamera() {
  cameraActive = false;
  if (html5QRCode) {
    try {
      if (html5QRCode.isScanning) await html5QRCode.stop();
      html5QRCode.clear();
    } catch(e) {}
    html5QRCode = null;
  }
  document.getElementById('cameraWrap').classList.remove('show');
  document.getElementById('cameraBtn').textContent = '📷 카메라로 바코드 스캔';
  document.getElementById('cameraBtn').classList.remove('scanning');
}

// ══════════════════════════════════════════
// 검색
// ══════════════════════════════════════════
function switchSearchTab(tab) {
  document.getElementById('search-isbn').style.display = tab === 'isbn' ? 'block' : 'none';
  document.getElementById('search-title').style.display = tab === 'title' ? 'block' : 'none';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('bookPreview').classList.remove('show');
  setStatus('');
  const activeStyle = 'flex:1;padding:8px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#0F0E0C;font-size:12px;font-weight:700;cursor:pointer;font-family:"Noto Sans KR",sans-serif;';
  const inactiveStyle = 'flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;font-family:"Noto Sans KR",sans-serif;';
  document.getElementById('tab-isbn').style.cssText = tab === 'isbn' ? activeStyle : inactiveStyle;
  document.getElementById('tab-title').style.cssText = tab === 'title' ? activeStyle : inactiveStyle;
}

async function searchByISBN() {
  const isbn = document.getElementById('isbnInput').value.trim();
  if (!isbn || isbn.length < 10) { setStatus('올바른 ISBN을 입력해주세요'); return; }
  setStatus('🔍 알라딘에서 책 정보를 찾고 있어요...');
  document.getElementById('bookPreview').classList.remove('show');
  document.getElementById('searchResults').style.display = 'none';
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?isbn=${isbn}`);
    const info = await res.json();
    if (info.found && info.results && info.results.length > 0) {
      selectBook(info.results[0]);
      setStatus('✅ 책 정보를 찾았어요!');
    } else {
      currentBook = { title:`ISBN ${isbn}`, author:'', publisher:'', pages:0, isbn };
      document.getElementById('previewTitle').textContent = `ISBN ${isbn}`;
      document.getElementById('previewAuthor').textContent = '책 정보를 찾지 못했어요';
      document.getElementById('previewPages').textContent = '';
      document.getElementById('previewImg').textContent = '📔';
      document.getElementById('bookPreview').classList.add('show');
      setStatus('⚠️ 정보를 찾지 못했어요');
    }
  } catch(e) { setStatus('⚠️ 네트워크 오류'); }
}

async function searchByTitle() {
  const title = document.getElementById('titleInput').value.trim();
  if (!title) { setStatus('책 제목을 입력해주세요'); return; }
  setStatus('🔍 알라딘에서 검색 중...');
  document.getElementById('bookPreview').classList.remove('show');
  document.getElementById('searchResults').style.display = 'none';
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?title=${encodeURIComponent(title)}`);
    const info = await res.json();
    if (info.found && info.results && info.results.length > 0) {
      setStatus(`📚 ${info.results.length}권 찾았어요. 선택해주세요!`);
      const resultBox = document.getElementById('searchResults');
      resultBox.style.display = 'flex';
      resultBox.innerHTML = info.results.map(book => {
        const bookJson = JSON.stringify(book).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `<div onclick='selectBook(JSON.parse(this.dataset.book))' data-book="${bookJson}" style="display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:border-color 0.2s;" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="width:36px;height:50px;border-radius:4px;overflow:hidden;flex-shrink:0;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;">
            ${book.coverImg ? `<img src="${book.coverImg}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.textContent='📗'">` : '📗'}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${book.title}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${book.author}</div>
            ${book.pages ? `<div style="font-size:11px;color:var(--gold);margin-top:2px;">${book.pages}쪽</div>` : ''}
          </div>
        </div>`;
      }).join('');
    } else {
      setStatus('⚠️ 검색 결과가 없어요');
    }
  } catch(e) { setStatus('⚠️ 네트워크 오류'); }
}

function selectBook(book) {
  currentBook = book;
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('previewTitle').textContent = book.title;
  document.getElementById('previewAuthor').textContent = `${book.author}${book.publisher?' · '+book.publisher:''}`;
  document.getElementById('previewPages').textContent = book.pages ? `📄 ${book.pages}쪽` : '';
  const imgEl = document.getElementById('previewImg');
  if (book.coverImg) {
    imgEl.innerHTML = `<img src="${book.coverImg}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" onerror="this.parentElement.textContent='📗'">`;
  } else {
    imgEl.textContent = '📗';
  }
  document.getElementById('bookPreview').classList.add('show');
  setStatus('✅ 선택됐어요!');
}

// ══════════════════════════════════════════
// CATEGORY / STARS (추가 모달)
// ══════════════════════════════════════════
function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn');
  document.getElementById('cat-'+cat).classList.add('active-'+cat);
}

function setStar(n) {
  currentStar = n;
  document.querySelectorAll('.modal-star').forEach((s,i) => s.classList.toggle('on', i < n));
  document.getElementById('ratingHint').textContent = '⭐'.repeat(n) + ' ' + starLabels[n];
}

// ══════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════
async function saveBook() {
  if (!currentBook) { alert('먼저 책을 검색해주세요!'); return; }
  if (!currentCat)  { alert('카테고리를 선택해주세요!'); return; }

  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = '저장 중...';

  const now = new Date();
  const book = {
    title: currentBook.title,
    author: currentBook.author || '',
    publisher: currentBook.publisher || '',
    isbn: currentBook.isbn || '',
    pages: currentBook.pages || 0,
    coverImg: currentBook.coverImg || '',
    cat: currentCat,
    star: currentStar,
    memo: document.getElementById('memoInput').value.trim(),
    createdAt: now.toISOString(),
    dateLabel: now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }),
    yearMonth: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,
    profileId: currentProfileId === 'all' ? '' : currentProfileId
  };

  try {
    const id = await saveToFirestore(book);
    books.unshift({ id, ...book });
    renderAll();
    closeModal();
  } catch(e) {
    alert('저장 실패: ' + e.message);
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').textContent = '책장에 저장하기';
  }
}

// ══════════════════════════════════════════
// DELETE
// ══════════════════════════════════════════
async function deleteBook(id, e) {
  e.stopPropagation();
  if (!confirm('이 책을 삭제할까요?')) return;
  try {
    await deleteFromFirestore(id);
    books = books.filter(b => b.id !== id);
    renderAll();
  } catch(e) { alert('삭제 실패: ' + e.message); }
}

// ══════════════════════════════════════════
// MODAL (추가)
// ══════════════════════════════════════════
function openModal() {
  document.getElementById('overlay').classList.add('open');
  resetModal();
}
function closeModal() {
  stopCamera();
  document.getElementById('overlay').classList.remove('open');
}
function handleOverlay(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}
function resetModal() {
  currentBook = null; currentCat = ''; currentStar = 0;
  document.getElementById('isbnInput').value = '';
  document.getElementById('titleInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
  switchSearchTab('isbn');
  document.getElementById('memoInput').value = '';
  document.getElementById('bookPreview').classList.remove('show');
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('ratingHint').textContent = '별점 선택 (선택사항)';
  document.querySelectorAll('.modal-star').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn');
  document.getElementById('saveBtn').disabled = false;
  document.getElementById('saveBtn').textContent = '책장에 저장하기';
}
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }

// 키보드 이벤트
document.getElementById('isbnInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchByISBN();
});
document.getElementById('titleInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchByTitle();
});
document.getElementById('goalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveGoal();
});
</script>
